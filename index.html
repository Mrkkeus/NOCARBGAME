<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกมตามหาอาหารไร้คาร์โบไฮเดรต - รูปการ์ตูนอาหารชัดเจน 100%</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Sarabun', Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            text-align: center;
            color: #2c3e50;
        }
        h1 { margin-bottom: 5px; font-size: 1.8rem; }
        .instructions { color: #7f8c8d; margin-bottom: 20px; }
        .game-wrapper { max-width: 850px; margin: 0 auto; }
        
        .game-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            background-color: #bdc3c7;
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        .grid-item {
            position: relative;
            aspect-ratio: 1 / 1;
            background-color: #fff;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            border: 3px solid transparent;
            transition: transform 0.1s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 5px;
        }
        .grid-item:hover { transform: scale(1.03); }
        .grid-item svg {
            width: 70%;
            height: 70%;
        }
        .grid-item .label {
            font-size: 0.8rem;
            font-weight: bold;
            margin-top: 4px;
            color: #333;
        }
        .grid-item.selected {
            border-color: #2ecc71;
            box-shadow: inset 0 0 0 4px rgba(46, 204, 113, 0.6);
        }
        .overlay-answer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(231, 76, 60, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-size: 2.5rem;
            font-weight: bold;
            pointer-events: none;
        }
        .show-answer .overlay-answer { display: flex; }
        
        .controls { margin-top: 20px; display: flex; justify-content: center; gap: 15px; }
        button {
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn-check { background-color: #2ecc71; color: white; }
        .btn-reset { background-color: #e74c3c; color: white; }
        
        #result {
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 15px;
            min-height: 35px;
            padding: 10px;
            border-radius: 8px;
        }
        .success { color: #27ae60; background-color: #e8f8f5; }
        .error { color: #c0392b; background-color: #fadbd8; }
        .warning { color: #d35400; background-color: #fdebd0; }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <h1>เกมตามหาอาหารไร้คาร์โบไฮเดรต 🥦🥩</h1>
        <div class="instructions">เลือกภาพอาหารที่ "ไม่มีคาร์โบไฮเดรต" ให้ครบ 10 ภาพ แล้วกดตรวจคำตอบ!</div>

        <div class="game-grid" id="gameGrid"></div>

        <div class="controls">
            <button class="btn-check" onclick="checkAnswers()">ตรวจคำตอบ</button>
            <button class="btn-reset" onclick="resetGame()">สุ่มภาพใหม่</button>
        </div>

        <div id="result">เลือกแล้ว 0 / 10 ภาพ</div>
    </div>

    <script>
        // รายการอาหาร 30 ชนิด ใช้ไอคอน SVG + ชื่อภาษาไทย ชัดเจน 100% ไม่ซ้ำ ไม่หลุด
        const foodDataList = [
            // --- กลุ่มไร้คาร์โบไฮเดรต (10 ชนิด) ---
            { name: "เนื้อสเต๊ก", icon: "🥩", isNoCarb: true },
            { name: "น่องไก่", icon: "🍗", isNoCarb: true },
            { name: "เบคอน", icon: "🥓", isNoCarb: true },
            { name: "ปลาแซลมอน", icon: "🐟", isNoCarb: true },
            { name: "ไข่ดาว", icon: "🍳", isNoCarb: true },
            { name: "กุ้ง", icon: "🦐", isNoCarb: true },
            { name: "ปลาหมึกย่าง", icon: "🦑", isNoCarb: true },
            { name: "มะพร้าวกะทิ", icon: "🥥", isNoCarb: true },
            { name: "เนยสด", icon: "🧈", isNoCarb: true },
            { name: "ถั่ว", icon: "🥜", isNoCarb: true },

            // --- กลุ่มมีคาร์โบไฮเดรต (20 ชนิด) ---
            { name: "ข้าวสวย", icon: "🍚", isNoCarb: false },
            { name: "ขนมปัง", icon: "🍞", isNoCarb: false },
            { name: "มันฝรั่ง", icon: "🥔", isNoCarb: false },
            { name: "ข้าวโพด", icon: "🌽", isNoCarb: false },
            { name: "พาสต้า", icon: "🍝", isNoCarb: false },
            { name: "ราเมง/บะหมี่", icon: "🍜", isNoCarb: false },
            { name: "ไอศครีม", icon: "🍨", isNoCarb: false },
            { name: "แอปเปิล", icon: "🍎", isNoCarb: false },
            { name: "กล้วยหอม", icon: "🍌", isNoCarb: false },
            { name: "ส้ม", icon: "🍊", isNoCarb: false },
            { name: "เค้ก", icon: "🍰", isNoCarb: false },
            { name: "พิซซ่า", icon: "🍕", isNoCarb: false },
            { name: "โดนัท", icon: "🍩", isNoCarb: false },
            { name: "คุกกี้", icon: "🍪", isNoCarb: false },
            { name: "ช็อกโกแลต", icon: "🍫", isNoCarb: false },
            { name: "แฮมเบอร์เกอร์", icon: "🍔", isNoCarb: false },
            { name: "เฟรนช์ฟรายส์", icon: "🍟", isNoCarb: false },
            { name: "นม", icon: "🥛", isNoCarb: false },
            { name: "ซูชิ", icon: "🍣", isNoCarb: false },
            { name: "แพนเค้ก", icon: "🥞", isNoCarb: false }
        ];

        let currentGridData = [];
        let selectedIndices = [];
        let isChecked = false;

        const gameGrid = document.getElementById('gameGrid');
        const resultDiv = document.getElementById('result');

        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function initGame() {
            gameGrid.innerHTML = '';
            selectedIndices = [];
            isChecked = false;
            currentGridData = shuffleArray(foodDataList);

            currentGridData.forEach((food, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.classList.add('grid-item');
                if (food.isNoCarb) itemDiv.classList.add('is-correct-answer');

                itemDiv.innerHTML = `
                    <div style="font-size: 3.2rem; line-height: 1;">${food.icon}</div>
                    <div class="label">${food.name}</div>
                    <div class="overlay-answer">✖</div>
                `;

                itemDiv.addEventListener('click', () => {
                    if (isChecked) return;
                    toggleSelect(index, itemDiv);
                });

                gameGrid.appendChild(itemDiv);
            });

            resultDiv.className = '';
            resultDiv.innerText = 'เลือกแล้ว 0 / 10 ภาพ';
        }

        function toggleSelect(index, element) {
            const pos = selectedIndices.indexOf(index);
            if (pos > -1) {
                selectedIndices.splice(pos, 1);
                element.classList.remove('selected');
            } else {
                if (selectedIndices.length >= 10) {
                    resultDiv.className = 'warning';
                    resultDiv.innerText = '⚠️ เลือกครบ 10 ภาพแล้วครับ กดปุ่มตรวจคำตอบได้เลย!';
                    return;
                }
                selectedIndices.push(index);
                element.classList.add('selected');
            }
            resultDiv.className = '';
            resultDiv.innerText = `เลือกแล้ว ${selectedIndices.length} / 10 ภาพ`;
        }

        function checkAnswers() {
            if (isChecked) return;

            if (selectedIndices.length !== 10) {
                resultDiv.className = 'error';
                resultDiv.innerText = `❌ กรุณาเลือกให้ครบ 10 ภาพก่อนครับ (ตอนนี้เลือกไปแล้ว ${selectedIndices.length} ภาพ)`;
                return;
            }

            isChecked = true;
            let correctCount = 0;

            selectedIndices.forEach(idx => {
                if (currentGridData[idx].isNoCarb) correctCount++;
            });

            document.querySelectorAll('.grid-item').forEach(item => {
                if (item.classList.contains('is-correct-answer')) {
                    item.classList.add('show-answer');
                }
            });

            if (correctCount === 10) {
                resultDiv.className = 'success';
                resultDiv.innerText = `🎉 เก่งมาก! ตอบถูกต้องทั้งหมด 10 / 10 ภาพ`;
            } else {
                resultDiv.className = 'error';
                resultDiv.innerText = `ตรวจคำตอบแล้ว: ได้ ${correctCount} / 10 คะแนน (ดูสัญลักษณ์ ✖ สีแดงทับภาพที่ถูกต้องได้เลยครับ)`;
            }
        }

        function resetGame() {
            initGame();
        }

        initGame();
    </script>
</body>
</html>
